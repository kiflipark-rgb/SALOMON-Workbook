// ====== SEARCH BY 국내품번 ======
function onSearchInput(inputEl) {
  var q = inputEl.value.trim();
  var qUpper = q.toUpperCase();
  var resultsEl = inputEl.nextElementSibling;
  if (!q || q.length < 2) { resultsEl.classList.remove('active'); return; }
  var products = window.__allProducts || [];
  var html = '';

  // Admin: show matching MD/DS as group shortcuts at top
  if (state.isAdmin && q.length >= 2) {
    var staffHits = [];
    var mdSeen = {}, dsSeen = {};
    products.forEach(function(p) {
      if (p.md && p.md.indexOf(q) >= 0 && !mdSeen[p.md]) {
        mdSeen[p.md] = true;
        var cnt = products.filter(function(x) { return x.md === p.md; }).length;
        staffHits.push({ role: 'md', name: p.md, count: cnt });
      }
      if (p.ds && p.ds.indexOf(q) >= 0 && !dsSeen[p.ds]) {
        dsSeen[p.ds] = true;
        var cnt = products.filter(function(x) { return x.ds === p.ds; }).length;
        staffHits.push({ role: 'ds', name: p.ds, count: cnt });
      }
    });
    staffHits.forEach(function(s) {
      html += '<div class="search-staff-item" onclick="openStaffList(\'' + s.role + '\',\'' + s.name + '\')">'
        + '<span><span class="search-staff-badge ' + s.role + '">' + s.role.toUpperCase() + '</span>' + s.name + '</span>'
        + '<span class="search-staff-count">' + s.count + '개 제품 전체보기 →</span></div>';
    });
  }

  // Product matches
  var matches = [];
  for (var i = 0; i < products.length; i++) {
    var p = products[i];
    var code12 = (p.code || '').substring(0, 12).toUpperCase();
    var nameMatch = (p.name || '').indexOf(q) >= 0;
    var adminMatch = false;
    if (state.isAdmin) {
      adminMatch = (p.ds || '').indexOf(q) >= 0 || (p.md || '').indexOf(q) >= 0;
    }
    if (code12.indexOf(qUpper) >= 0 || nameMatch || adminMatch) { matches.push(p); if (matches.length >= 10) break; }
  }
  html += matches.map(function(p) {
    var extraInfo = state.isAdmin ? ' <span style="color:#888;font-size:11px;">' + (p.ds||'') + '/' + (p.md||'') + '</span>' : '';
    return '<div class="search-result-item" onclick="searchGoToProduct(\'' + p.code + '\')">'
      + '<span class="search-result-name">' + p.name + extraInfo + '</span>'
      + '<span class="search-result-code">' + p.code.substring(0,12) + '</span></div>';
  }).join('');

  if (!html) { resultsEl.classList.remove('active'); return; }
  resultsEl.innerHTML = html;
  resultsEl.classList.add('active');
}
function searchGoToProduct(code) {
  document.querySelectorAll('.search-results').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.search-bar input').forEach(function(el) { el.value = ''; });
  var products = window.__allProducts || [];
  var p = null;
  for (var i = 0; i < products.length; i++) { if (products[i].code === code) { p = products[i]; break; } }
  if (p) { currentCategory = p.cat; openProduct(p.id); }
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('.search-bar')) {
    document.querySelectorAll('.search-results').forEach(function(el) { el.classList.remove('active'); });
  }
});


// ============ ADMIN MANAGEMENT ============
function showAdminMgmt() {
  showScreen('screen-admin-mgmt');
  renderAdminList();
  document.getElementById('userPinEdit').value = getUserPin();
}

function renderAdminList() {
  var admins = getAdmins();
  var el = document.getElementById('adminAccountList');
  el.innerHTML = admins.map(function(a, i) {
    var isSuperAdmin = (a.email === SUPER_ADMIN);
    var tag = isSuperAdmin ? '<span class="account-tag">슈퍼관리자</span>' : '';
    var delBtn = isSuperAdmin ? '' : '<button class="del" onclick="removeAdmin(' + i + ')">삭제</button>';
    return '<div class="admin-account-item">'
      + '<div class="account-info"><span class="account-email">' + a.email + '</span>' + tag + '</div>'
      + '<div class="account-actions">'
      + '<button onclick="promptChangePin(' + i + ')">PIN 변경</button>'
      + delBtn
      + '</div></div>';
  }).join('');
}

function addAdminAccount() {
  var email = (document.getElementById('newAdminEmail').value || '').trim().toLowerCase();
  var pin = (document.getElementById('newAdminPin').value || '').trim();
  if (!email || !email.includes('@')) { toast('올바른 이메일을 입력하세요'); return; }
  if (pin.length !== 6 || !/^\d{6}$/.test(pin)) { toast('6자리 숫자 PIN을 입력하세요'); return; }
  var admins = getAdmins();
  if (admins.some(a => a.email === email)) { toast('이미 등록된 계정입니다'); return; }
  admins.push({ email: email, pin: pin });
  saveAdmins(admins);
  document.getElementById('newAdminEmail').value = '';
  document.getElementById('newAdminPin').value = '';
  renderAdminList();
  toast(email + ' 관리자 추가 완료');
}

function removeAdmin(idx) {
  var admins = getAdmins();
  if (admins[idx].email === SUPER_ADMIN) { toast('슈퍼관리자는 삭제할 수 없습니다'); return; }
  if (!confirm(admins[idx].email + ' 계정을 삭제하시겠습니까?')) return;
  admins.splice(idx, 1);
  saveAdmins(admins);
  renderAdminList();
  toast('삭제 완료');
}

function promptChangePin(idx) {
  var admins = getAdmins();
  var newPin = prompt(admins[idx].email + '의 새 PIN (6자리 숫자):');
  if (!newPin) return;
  newPin = newPin.trim();
  if (newPin.length !== 6 || !/^\d{6}$/.test(newPin)) { toast('6자리 숫자를 입력하세요'); return; }
  admins[idx].pin = newPin;
  saveAdmins(admins);
  renderAdminList();
  toast('PIN 변경 완료');
}

function saveUserPin() {
  var pin = (document.getElementById('userPinEdit').value || '').trim();
  if (pin.length !== 6 || !/^\d{6}$/.test(pin)) { toast('6자리 숫자 PIN을 입력하세요'); return; }
  saveUserPinVal(pin);
  toast('일반 사용자 PIN 저장 완료');
}


// ============ ITEM SUB-CATEGORY ============
var currentItemCategory = '';
function openCategory(catId) {
  currentItemCategory = catId;
  var catDef = CATEGORIES.find(function(c) { return c.id === catId; });
  document.getElementById('itemScreenTitle').textContent = catDef ? catDef.name : catId;
  renderItemGrid(catId);
  showScreen('screen-item');
}

function renderItemGrid(catId) {
  var allCatProds = PRODUCTS.filter(function(p) { return p.cat === catId; });
  var prods = applyFilter(allCatProds);
  renderFilterBar('itemFilterBar', allCatProds, function() { renderItemGrid(catId); });
  var itemNames = {};
  prods.forEach(function(p) {
    var n = p.item_name || '기타';
    if (!itemNames[n]) itemNames[n] = 0;
    itemNames[n]++;
  });
  var grid = document.getElementById('itemGrid');
  grid.innerHTML = '';
  Object.keys(itemNames).sort().forEach(function(name) {
    var card = document.createElement('div');
    card.className = 'cat-card';
    card.innerHTML = '<div class="cat-name" style="font-size:15px;">' + name + '</div>'
      + '<div class="cat-count">' + itemNames[name] + '개 제품</div>';
    card.onclick = function() { openItemList(catId, name); };
    grid.appendChild(card);
  });
}

function openItemList(catId, itemName) {
  state.currentCategory = catId;
  state.currentItemName = itemName;
  renderProductList(itemName);
  showScreen('screen-list');
}

// Override goToList to go back to item list
var _origGoToList = typeof goToList === 'function' ? goToList : null;
function goToListFromDetail() {
  if (state.productHistory && state.productHistory.length > 0) {
    const prevId = state.productHistory.pop();
    const prevProduct = PRODUCTS.find(x => x.id === prevId);
    if (prevProduct) {
      state.currentProduct = prevProduct;
      openProduct(prevId);
      return;
    }
  }
  if (state.staffFilter) {
    openStaffList(state.staffFilter.role, state.staffFilter.name);
  } else if (state.currentItemName) {
    openItemList(state.currentCategory, state.currentItemName);
  } else {
    goToCategories();
  }
}

// ============ SIZE CHART ============
function openSizeChart(productCode) {
  var p = PRODUCTS.find(function(pp) { return pp.code === productCode; });
  if (!p) return;
  document.getElementById('sizeChartTitle').textContent = p.name + ' 사이즈 차트';
  // Find widest size run among all colorways
  var allSizes = ['XS','S','M','L','XL','2XL','3XL','220','225','230','235','240','245','250','255','260','265','270','275','280','285','290'];
  var widestStr = p.size || '';
  if (p.colorways && p.colorways.length) {
    var widestCount = 0;
    p.colorways.forEach(function(cw) {
      var cwSizeStr = cw.size || '';
      var parts = cwSizeStr.split('-').map(function(s) { return s.trim(); }).filter(Boolean);
      if (parts.length >= 2) {
        var si = allSizes.indexOf(parts[0]);
        var ei = allSizes.indexOf(parts[parts.length - 1]);
        if (si >= 0 && ei >= 0 && (ei - si + 1) > widestCount) {
          widestCount = ei - si + 1;
          widestStr = cwSizeStr;
        }
      }
    });
  }
  var sizes = widestStr.split('-').map(function(s) { return s.trim(); }).filter(Boolean);
  if (sizes.length < 2) sizes = ['S','M','L','XL'];
  var startIdx = allSizes.indexOf(sizes[0]);
  var endIdx = allSizes.indexOf(sizes[sizes.length - 1]);
  var sizeRange = [];
  if (startIdx >= 0 && endIdx >= 0) {
    for (var i = startIdx; i <= endIdx; i++) sizeRange.push(allSizes[i]);
  } else {
    sizeRange = sizes;
  }
  // Test data for size chart
  var specs = [];
  var cat = p.cat;
  if (cat === 'OUTER' || cat === 'TOP') {
    specs = ['총장', '가슴둘레', '어깨너비', '소매길이'];
  } else if (cat === 'BOTTOM') {
    specs = ['총장', '허리둘레', '힙둘레', '밑위', '밑단둘레'];
  } else {
    specs = ['총장', '가슴둘레', '어깨너비'];
  }
  var table = document.getElementById('sizeChartTable');
  var html = '<thead><tr><th>구분</th>';
  sizeRange.forEach(function(s) { html += '<th>' + s + '</th>'; });
  html += '</tr></thead><tbody>';
  specs.forEach(function(spec, si) {
    html += '<tr><td style="font-weight:600;">' + spec + '</td>';
    sizeRange.forEach(function(s, sj) {
      var base = 50 + si * 5 + sj * 2;
      html += '<td>' + base + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody>';
  table.innerHTML = html;
  document.getElementById('sizeChartOverlay').classList.add('active');
}
function closeSizeChart() {
  document.getElementById('sizeChartOverlay').classList.remove('active');
}


function goBackFromList() {
  if (state.staffFilter) {
    state.staffFilter = null;
    goToCategories();
  } else if (state.currentItemName && currentItemCategory) {
    openCategory(currentItemCategory);
  } else {
    goToCategories();
  }
}
