<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SALOMON Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="data/products.js"></script>
<script src="data/frames_manifest.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f6f8;
    color: #1a1a1a;
    min-height: 100vh;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; position: relative; padding-bottom: 80px; overflow-x: hidden; }
  .screen { display: none; padding: 20px 16px; animation: fadeIn 0.25s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* Header */
  .header {
    position: sticky; top: 0; background: #fff; z-index: 10;
    padding: 14px 20px; border-bottom: 1px solid #eee;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 17px; font-weight: 700; font-family: 'Barlow Condensed', 'Noto Sans KR', sans-serif; letter-spacing: 0.5px; }
  .header .back { background: none; border: none; font-size: 22px; cursor: pointer; padding: 4px 8px; color: #333; }
  .header .user { font-size: 12px; color: #888; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .logout-btn {
    background: #f5f6f8; border: 1px solid #e1e3e8; color: #555;
    font-size: 11px; font-weight: 600; padding: 5px 10px;
    border-radius: 12px; cursor: pointer;
  }
  .logout-btn:active { background: #e9eaef; }

  /* Login */
  #screen-login {
    padding: 0 !important;
    position: relative;
    min-height: 100vh;
    background: url('https://images.unsplash.com/photo-1448375240586-882707db888b?w=1200&q=80') center center / cover no-repeat fixed;
  }
  @supports (-webkit-touch-callout: none) {
    #screen-login { background-attachment: scroll; }
  }
  #screen-login::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, rgba(255,255,255,0.50) 0%, rgba(255,255,255,0.88) 40%, rgba(255,255,255,0.96) 100%);
    z-index: 0;
  }
  .login-wrap { padding: 50px 24px 40px; text-align: center; position: relative; z-index: 1; }
  #screen-login {
    background: #f5f6f8;
    min-height: 100vh;
  }
  #screen-login .login-wrap {
    background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
    margin: 40px 16px;
    border-radius: 20px;
    padding: 50px 24px 40px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }
  #screen-login .logo-sub { color: #e0e0e0; letter-spacing: 3px; font-size: 13px; }
  #screen-login .hint { color: rgba(255,255,255,0.6); }
  #screen-login .input { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25); color: #fff; }
  #screen-login .input:focus { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.2); }
  #screen-login .input::placeholder { color: rgba(255,255,255,0.5); }
  #screen-login .btn { background: #fff; color: #1e293b; font-weight: 700; }
  .logo-img { width: 180px; margin: 0 auto 10px; display: block; }
  .logo-sub {
    font-family: 'Barlow Condensed', sans-serif;
    color: #1a1a1a; font-size: 16px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 36px;
  }
  .input {
    width: 100%; padding: 14px 16px; border: 1.5px solid #e1e3e8; border-radius: 10px;
    font-size: 15px; margin-bottom: 12px; outline: none; transition: border 0.15s;
  }
  .input:focus { border-color: #1a1a1a; }
  .btn {
    width: 100%; padding: 14px; background: #1a1a1a; color: #fff; border: none;
    border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: 'Barlow Condensed', 'Noto Sans KR', sans-serif; letter-spacing: 0.5px;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.8; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .btn-ghost { background: #f0f2f5; color: #333; }
  .hint { color: #888; font-size: 12px; margin-top: 12px; }

  /* Product list */
  .list-title { padding: 4px 0 14px; font-size: 13px; color: #666; }
  .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .product-card {
    background: #fff; border: 1px solid #ececec; border-radius: 12px; overflow: hidden;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  }
  .product-card:active { transform: scale(0.97); }
  .product-card .thumb {
    width: 100%; aspect-ratio: 1; background: #f5f6f8;
    position: relative;
    font-size: 38px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .product-card .thumb img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: contain;
    background: #f5f6f8;
  }
  .product-card .thumb video {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: contain; display: block;
    pointer-events: none; background: #f5f6f8;
  }
  .apc-thumb { position: relative; overflow: hidden; }
  .apc-thumb video {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: contain; display: block;
    background: #f5f6f8;
  }

  /* Category grid */
  .cat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px;
    width: 100%; max-width: 100%;
  }
  .cat-card {
    background: #fff; border: 1px solid #ececec; border-radius: 14px;
    padding: 18px 10px; cursor: pointer; text-align: center;
    transition: transform 0.15s, box-shadow 0.15s;
    aspect-ratio: 1.3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 0; width: 100%;
  }
  .cat-card:active { transform: scale(0.96); }
  .cat-card .cat-icon { font-size: 42px; margin-bottom: 10px; }
  .cat-card .cat-name { font-size: 15px; font-weight: 700; color: #1a1a1a; }
  .cat-card .cat-meta { font-size: 11px; color: #888; margin-top: 4px; }
  .cat-card .cat-progress {
    margin-top: 8px; width: 100%; height: 4px; background: #f0f2f5; border-radius: 4px; overflow: hidden;
  }
  .cat-card .cat-progress-bar { height: 100%; background: #0e9e5e; transition: width 0.3s; }
  .product-card .info { padding: 10px 12px 12px; }
  .product-card .name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .product-card .meta { font-size: 11px; color: #888; display: flex; justify-content: space-between; }
  .product-card .badge-done { color: #0e9e5e; font-weight: 600; }

  /* Image watermark (tiled) */
  .img-watermark {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    overflow: hidden;
  }

  /* Product image viewer */
  .viewer-box {
    width: 100%; aspect-ratio: 1;
    background: radial-gradient(ellipse at 50% 60%, #ffffff 0%, #e8ebf0 75%, #d8dde4 100%);
    border-radius: 16px;
    position: relative; overflow: hidden; margin-bottom: 8px;
  }
  .viewer-box::after {
    content: ''; position: absolute; left: 18%; right: 18%; bottom: 8%; height: 14px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0) 70%);
    filter: blur(3px);
    pointer-events: none;
  }
  .ai-disclaimer {
    font-size: 10px; color: #9aa0a6; text-align: center;
    margin: -6px 0 14px; padding: 0 4px; line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }


  /* Comment system */
  .reply-item {
    background: #f0f0f0; border-radius: 8px; padding: 8px 10px; margin-top: 6px;
    margin-left: 16px; border-left: 2px solid #1a1a1a;
  }
  .comment-item.no-reply {
    border-left: 3px solid #ff3b30;
  }

  .comment-item {
    background: #f8f8f8; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  }
  .comment-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;
  }
  .comment-author { font-size: 11px; font-weight: 700; color: #1a1a1a; }
  .comment-date { font-size: 10px; color: #999; }
  .comment-body { font-size: 12px; color: #444; line-height: 1.5; }
  .comment-delete { font-size: 10px; color: #ff3b30; cursor: pointer; margin-left: 8px; }
  /* Admin edit */
  .desc-edit-row { margin-bottom: 8px; padding: 8px; background: #fafbfc; border-radius: 8px; border: 1px solid #eee; }
  .desc-edit-row label { font-size: 11px; color: #888; display: block; margin-bottom: 2px; }
  .desc-edit-row .input { margin-bottom: 4px; }
  .desc-edit-row .btn-del { font-size: 11px; color: #ff3b30; cursor: pointer; float: right; }
  .badge-inquiry {
    display: inline-block; background: #ff3b30; color: #fff; font-size: 10px;
    font-weight: 700; min-width: 16px; height: 16px; line-height: 16px;
    text-align: center; border-radius: 8px; margin-left: 6px; padding: 0 4px;
    vertical-align: middle;
  }
  /* Product spec table */
  .pd-spec-block {
    background: #f8f9fb; border: 1px solid #e8eaed; border-radius: 12px;
    padding: 10px 16px; margin-bottom: 14px;
  }
  .pd-spec-grid {
    display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center;
  }
  .pd-spec-grid .spec-item {
    display: flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .pd-spec-grid .spec-label { font-size: 11px; color: #999; font-weight: 600; letter-spacing: 0.3px; }
  .pd-spec-grid .spec-val { font-size: 14px; color: #333; font-weight: 600; }
  .pd-colorway-table { width: 100%; border-collapse: collapse; }
  .pd-colorway-table th {
    font-size: 11px; color: #888; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; text-align: left; padding: 8px 10px;
    border-bottom: 2px solid #ddd; background: #f8f9fb;
  }
  .pd-colorway-table td {
    font-size: 13px; color: #333; padding: 8px 10px;
    border-bottom: 1px solid #eee; vertical-align: middle;
  }
  .pd-colorway-table tr:last-child td { border-bottom: none; }
  .pd-colorway-table .lc-code {
    font-family: 'SF Mono', 'Menlo', monospace; font-size: 11px; color: #555; font-weight: 500;
  }
  .pd-colorway-table .color-dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.12); margin-right: 6px; vertical-align: middle;
  }

  /* Product info block (desc / price / keywords) */
  .pd-info-block {
    background: #fafbfc; border: 1px solid #ececef; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 18px;
  }
  .pd-desc {
    font-size: 13px; color: #333; line-height: 1.55; margin-bottom: 10px;
  }
  .pd-overview {
    font-size: 13px; color: #555; line-height: 1.6; margin-bottom: 12px;
    font-style: italic; border-left: 3px solid #1a1a1a; padding-left: 10px;
  }
  .pd-desc-items { margin-bottom: 12px; }
  .pd-desc-item { margin-bottom: 10px; }
  .pd-desc-item-title {
    font-size: 13px; font-weight: 700; color: #1a1a1a;
    margin-bottom: 4px;
  }
  .pd-desc-item-content {
    font-size: 12px; color: #555; line-height: 1.6;
  }
  .pd-benefit {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px;
  }
  .pd-benefit .ben-tag {
    font-size: 10px; color: #fff; background: #1a1a1a;
    padding: 4px 10px; border-radius: 20px; letter-spacing: 0.3px;
  }
  .pd-top-info {
    padding: 12px 0 8px; margin-bottom: 10px;
    border-bottom: 1px solid #eee;
  }
  .pd-price {
    font-size: 24px; font-weight: 900; color: #1a1a1a;
    margin-bottom: 8px; letter-spacing: -0.5px;
  }
  .pd-keywords {
    display: flex; flex-wrap: wrap; gap: 5px;
  }
  .pd-keywords .kw {
    font-size: 11px; color: #1a1a1a; background: #f0f0f0;
    padding: 4px 9px; border-radius: 12px; font-weight: 600;
  }

  .pd-launch {
    font-size: 14px; font-weight: 800; color: #2E75B6;
    text-align: right; letter-spacing: -0.3px;
    padding: 3px 0;
  }
  .pd-launch:empty { display: none; }

  /* Product detail head row with colorway chips */
  .pd-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px; margin-bottom: 14px;
  }
  .pd-head-left { flex: 1; min-width: 0; }
  .pd-head-right { flex-shrink: 0; max-width: 45%; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .pd-color-chips {
    display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end;
    align-items: center;
  }
  .pd-color-chips .pd-chip {
    display: flex; align-items: center; gap: 3px;
    padding: 3px 7px; background: #f0f2f5; border: 1.5px solid transparent;
    border-radius: 12px; font-size: 9.5px; font-weight: 700; color: #555;
    cursor: pointer; letter-spacing: 0.2px; white-space: nowrap;
  }
  .pd-color-chips .pd-chip.active {
    background: #fff; border-color: #1a1a1a; color: #1a1a1a;
  }
  .pd-color-chips .pd-chip .swatch {
    width: 12px; height: 12px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.12);
  }

  /* Colorway overlay inside viewer-box */
  .colorway-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #fdfdfd 0%, #eef0f3 100%);
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
  }
  .colorway-overlay img {
    max-width: 82%; max-height: 82%; object-fit: contain;
    filter: drop-shadow(0 14px 22px rgba(0,0,0,0.22));
    -webkit-user-drag: none; pointer-events: none;
  }
  .colorway-code {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.62); color: #fff;
    font-size: 12px; font-weight: 700; letter-spacing: 1px;
    padding: 4px 12px; border-radius: 10px;
  }

  /* Admin product card */
  .admin-prod-card {
    display: flex; align-items: center; gap: 12px;
    background: #f5f6f8; border-radius: 12px; padding: 12px;
    margin-bottom: 8px; cursor: pointer; transition: background 0.12s;
  }
  .admin-prod-card:active { background: #e9eaef; }
  .admin-prod-card.empty { cursor: default; }
  .apc-thumb {
    width: 56px; height: 56px; flex-shrink: 0;
    background: linear-gradient(180deg,#fff,#eef0f3);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .apc-thumb img { max-width: 90%; max-height: 90%; object-fit: contain; }
  .apc-thumb span { font-size: 28px; }
  .apc-info { flex: 1; min-width: 0; }
  .apc-name { font-weight: 600; font-size: 13px; }
  .apc-meta { font-size: 11px; color: #888; margin-top: 2px; }
  .apc-stats { font-size: 11px; color: #555; margin-top: 4px; }
  .apc-arrow { font-size: 22px; color: #bbb; padding-right: 4px; }

  /* Admin detail */
  .admin-detail-head {
    background: linear-gradient(180deg,#fff,#f6f7f9);
    padding: 16px; border-radius: 12px; margin-bottom: 14px;
    border: 1px solid #eee;
  }
  .apd-head-row { display: flex; align-items: center; gap: 12px; }
  .apd-thumb {
    width: 64px; height: 64px; flex-shrink: 0;
    background: linear-gradient(180deg,#fff,#eef0f3);
    border-radius: 12px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #e8eaee;
  }
  .apd-thumb img { max-width: 92%; max-height: 92%; object-fit: contain; }
  .apd-thumb span { font-size: 32px; }
  .apd-head-info { flex: 1; min-width: 0; }
  .admin-detail-head .name { font-size: 17px; font-weight: 700; }
  .admin-detail-head .code { font-size: 12px; color: #888; margin-top: 3px; }
  .admin-detail-head .count {
    display: inline-block; margin-top: 8px; font-size: 11px; color: #fff;
    background: #1a1a1a; padding: 3px 10px; border-radius: 10px; font-weight: 600;
  }
  .agg-section-title {
    font-size: 12px; font-weight: 700; color: #666;
    margin-bottom: 8px; letter-spacing: 0.3px;
  }
  .agg-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
  }
  .agg-label { font-size: 12px; color: #444; width: 70px; flex-shrink: 0; }
  .agg-bar {
    flex: 1; height: 8px; background: #ececef; border-radius: 4px; overflow: hidden;
  }
  .agg-bar-fill { height: 100%; background: linear-gradient(90deg,#2d72d2,#5c9eff); }
  .agg-val { font-size: 12px; font-weight: 700; color: #1a1a1a; width: 28px; text-align: right; }
  .agg-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .agg-tag {
    font-size: 11px; background: #fff3f0; color: #d93025;
    border: 1px solid #ffd6cc; padding: 4px 9px; border-radius: 12px;
  }
  .agg-tag b { font-weight: 700; margin-left: 2px; }

  .fb-item {
    background: #fafbfc; border: 1px solid #ececef; border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .fb-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
  }
  .fb-user { font-size: 13px; font-weight: 700; color: #222; }
  .fb-time { font-size: 11px; color: #999; }
  .fb-ratings { font-size: 12px; color: #444; margin-bottom: 6px; }
  .fb-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .fb-tag {
    font-size: 10.5px; background: #fff3f0; color: #d93025;
    padding: 2px 7px; border-radius: 8px;
  }
  .fb-comment {
    font-size: 12px; color: #555; font-style: italic;
    background: #fff; border-left: 3px solid #1a1a1a;
    padding: 6px 10px; border-radius: 4px; margin-bottom: 6px;
  }
  .fb-markers {
    font-size: 11px; color: #666; line-height: 1.6;
    background: #fff; border-radius: 6px; padding: 6px 10px;
  }
  .marker {
    position: absolute; width: 26px; height: 26px; border-radius: 50%;
    background: #ff3b30; color: #fff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 8px rgba(255,59,48,0.5);
    border: 2px solid #fff;
    cursor: pointer;
  }
  .marker.pulse::after {
    content: ''; position: absolute; inset: -6px; border: 2px solid #ff3b30;
    border-radius: 50%; animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.8); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  /* Product detail */
  .pd-name {
    font-size: 17px; font-weight: 700; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pd-meta {
    color: #888; font-size: 11.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Ratings */
  .section { margin-bottom: 22px; }
  .section-title {
    font-size: 13px; font-weight: 600; color: #444; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .section-title .req { color: #ff3b30; font-size: 11px; }
  .rating-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0;
  }
  .rating-label { font-size: 14px; color: #333; }
  .stars { display: flex; gap: 3px; }
  .star {
    font-size: 26px; color: #e0e0e0; cursor: pointer; user-select: none;
    transition: transform 0.1s, color 0.1s;
  }
  .star.filled { color: #ffb800; }
  .star:active { transform: scale(1.2); }

  /* Tags */
  .tag-group { margin-bottom: 14px; }
  .tag-group-label { font-size: 12px; color: #777; margin-bottom: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    padding: 7px 12px; background: #f0f2f5; border: 1.5px solid transparent;
    border-radius: 16px; font-size: 12px; color: #555; cursor: pointer;
    transition: all 0.12s;
  }
  .tag.selected { background: #f0f0f0; border-color: #1a1a1a; color: #1a1a1a; font-weight: 600; }
  .tag.selected.negative { background: #fde8e8; border-color: #d64545; color: #d64545; }

  /* Textarea */
  textarea.input {
    min-height: 70px; resize: vertical; font-family: inherit;
  }

  /* Markers list */
  .markers-list { margin-top: 10px; }
  .marker-item {
    display: flex; gap: 10px; padding: 10px; background: #fafafa;
    border-radius: 8px; margin-bottom: 6px; align-items: flex-start;
  }
  .marker-num {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    background: #ff3b30; color: #fff; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .marker-text { flex: 1; font-size: 13px; color: #333; }
  .marker-del { background: none; border: none; color: #999; cursor: pointer; font-size: 16px; }

  /* Submit bar */
  .submit-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    max-width: 480px; width: 100%; background: #fff;
    padding: 12px 20px; border-top: 1px solid #eee;
    display: flex; gap: 8px;
  }

  /* Toast */
  .toast {
    position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
    background: #1a1a1a; color: #fff; padding: 12px 22px; border-radius: 22px;
    font-size: 13px; z-index: 100; opacity: 0; transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }

  /* Marker input modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: 14px; padding: 20px; width: 100%; max-width: 360px;
  }
  .modal h3 { font-size: 15px; margin-bottom: 12px; }
  .modal .modal-btns { display: flex; gap: 8px; margin-top: 12px; }

  /* Summary screen */
  .summary-box {
    background: #f0f8f2; border-radius: 12px; padding: 20px; text-align: center;
    margin-bottom: 20px;
  }
  .summary-box .check { font-size: 48px; margin-bottom: 10px; }
  .summary-box h2 { font-size: 17px; margin-bottom: 6px; }
  .summary-box p { font-size: 13px; color: #666; }

  /* Admin preview */
  .admin-stat { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-card {
    background: #f5f6f8; border-radius: 10px; padding: 14px;
  }
  .stat-num { font-size: 22px; font-weight: 700; color: #1a1a1a; }
  .stat-label { font-size: 11px; color: #888; margin-top: 2px; }


  /* Search Bar */
  .search-bar {
    padding: 8px 16px 4px;
    position: relative;
  }
  .search-bar input {
    width: 100%;
    padding: 9px 14px 9px 36px;
    border: 1.5px solid #ddd;
    border-radius: 10px;
    font-size: 14px;
    background: #f8f9fa;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: #2E75B6; background: #fff; }
  .search-bar::before {
    content: '\1F50D';
    position: absolute;
    left: 28px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    pointer-events: none;
  }
  .search-results {
    position: absolute;
    top: 100%;
    left: 16px;
    right: 16px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    max-height: 260px;
    overflow-y: auto;
    z-index: 99;
    display: none;
  }
  .search-results.active { display: block; }
  .search-result-item {
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: #f5f8fc; }
  .search-result-name { font-size: 13px; font-weight: 600; }
  .search-result-code { font-size: 11px; color: #888; }


  .admin-account-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: #f8f9fa; border-radius: 10px; margin-bottom: 8px;
  }
  .admin-account-item .account-info { flex: 1; }
  .admin-account-item .account-email { font-size: 13px; font-weight: 600; }
  .admin-account-item .account-actions { display: flex; gap: 6px; }
  .admin-account-item .account-actions button {
    font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 1px solid #ddd;
    background: #fff; cursor: pointer;
  }
  .admin-account-item .account-actions button.del { color: #e74c3c; border-color: #e74c3c; }
  .admin-account-item .account-tag {
    font-size: 10px; color: #fff; background: #2E75B6; padding: 2px 6px;
    border-radius: 4px; margin-left: 6px;
  }


  .size-chart-overlay {
    display:none; position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;
  }
  .size-chart-overlay.active { display:flex; }
  .size-chart-box {
    background:#fff; border-radius:16px; padding:20px; max-width:90vw; max-height:80vh;
    overflow:auto; position:relative; min-width:300px;
  }
  .size-chart-box h3 { font-size:15px; font-weight:700; margin-bottom:12px; }
  .size-chart-box table { width:100%; border-collapse:collapse; font-size:12px; }
  .size-chart-box th, .size-chart-box td {
    border:1px solid #e0e0e0; padding:6px 10px; text-align:center;
  }
  .size-chart-box th { background:#f5f6f8; font-weight:600; }
  .size-chart-close {
    position:absolute; top:12px; right:14px; font-size:20px; cursor:pointer;
    background:none; border:none; color:#888;
  }
  .btn-size-chart { background:#2E75B6; color:#fff; border:none; border-radius:8px; padding:4px 10px; font-size:11px; cursor:pointer; white-space:nowrap; }

  /* ===== Pivot-style Drag & Drop Filter ===== */
  .pivot-filter { margin:4px 0 10px; display:flex; flex-direction:column; gap:8px; }
  .pivot-row { display:flex; flex-direction:column; gap:4px; }
  .pivot-row-header { display:flex; align-items:center; gap:6px; }
  .pivot-row-label {
    font-size:10px; font-weight:700; color:#999; text-transform:uppercase;
    letter-spacing:.5px; flex-shrink:0;
  }
  .pivot-row-arrow { font-size:10px; color:#bbb; }
  .pivot-drop-zone {
    min-height:34px; border:1.5px dashed #ccc; border-radius:10px;
    padding:5px 10px; display:flex; flex-wrap:wrap; gap:5px; align-items:center;
    background:#fafbfc; transition:border-color .2s, background .2s;
  }
  .pivot-drop-zone.drag-over { border-color:#2E75B6; background:#e8f2fd; }
  .pivot-drop-zone-hint {
    font-size:11px; color:#bbb; user-select:none; pointer-events:none;
  }
  .pivot-pool {
    display:flex; flex-wrap:wrap; gap:5px; padding:0 2px;
  }
  .pivot-chip {
    display:inline-flex; align-items:center; gap:4px;
    padding:5px 11px; border-radius:14px; font-size:12px; font-weight:600;
    cursor:grab; user-select:none; transition:transform .15s, box-shadow .15s, opacity .15s;
    border:none; white-space:nowrap;
  }
  .pivot-chip:active { cursor:grabbing; transform:scale(1.06); }
  .pivot-chip.dragging { opacity:.35; transform:scale(.92); }
  .pivot-chip.pool-chip { background:#f0f2f5; color:#777; }
  .pivot-chip.active-chip.line-chip { background:#e8f0fe; color:#1a56db; }
  .pivot-chip.active-chip.class-chip { background:#fef3e2; color:#b45309; }
  .pivot-chip .chip-x {
    width:15px; height:15px; border-radius:50%; display:inline-flex; align-items:center;
    justify-content:center; font-size:12px; line-height:1; cursor:pointer;
    background:rgba(0,0,0,.1); color:rgba(0,0,0,.5); flex-shrink:0; margin-left:2px;
  }
  .pivot-chip .chip-x:hover { background:rgba(0,0,0,.22); }
  /* Staff search result items */
  .search-staff-item {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; border-bottom:1px solid #f0f0f0; cursor:pointer;
  }
  .search-staff-item:hover { background:#f8f9fa; }
  .search-staff-badge {
    display:inline-block; padding:2px 7px; border-radius:8px;
    font-size:10px; font-weight:700; margin-right:6px;
  }
  .search-staff-badge.md { background:#f0e8fe; color:#7c3aed; }
  .search-staff-badge.ds { background:#e8fef0; color:#0d9448; }
  .search-staff-count { font-size:11px; color:#999; }

</style>

<div class="app">

<script>
// ============ SAMPLE DATA ============
const ANGLE_LABELS = ['앞면', '앞-좌', '좌측', '뒤-좌', '뒷면'];
const CATEGORIES = [
  { id: 'OUTER',      name: '아우터',     icon: '🧥', prefix: 'OT' },
  { id: 'TOP',        name: '상의',       icon: '👕', prefix: 'TP' },
  { id: 'BOTTOM',     name: '하의',       icon: '👖', prefix: 'BT' },
  { id: 'BAG',        name: '가방',       icon: '🎒', prefix: 'BG' },
  { id: 'HEADWEAR',   name: '헤드웨어',   icon: '🧢', prefix: 'HW' },
  { id: 'ACC',        name: '액세서리',   icon: '🧤', prefix: 'AC' },
];

// ============ 카테고리별 기본 설명/키워드 (Excel 제품설명·키워드 비었을 때 fallback) ============
const SAMPLE_DESC = {
  'OUTER':    '경량 원단과 기능성 구조로 다양한 기상 조건에 대응하는 아웃도어 자켓.',
  'TOP':      '보온성과 통기성을 겸비한 퍼포먼스 상의. 레이어링 또는 단독 착용.',
  'BOTTOM':   '4-way 스트레치와 기능성 포켓을 적용한 활동성 높은 하의.',
  'BAG':      '트레일과 일상을 연결하는 기능성 가방.',
  'HEADWEAR': '자외선 차단과 쾌적함을 제공하는 헤드웨어.',
  'ACC':      '야외 활동에 최적화된 기능성 액세서리.',
};
const SAMPLE_KEYWORDS = {
  'OUTER':    ['#경량', '#발수가공', '#윈드프루프', '#패커블'],
  'TOP':      ['#보온', '#플리스', '#레이어링', '#통기성'],
  'BOTTOM':   ['#4-way스트레치', '#발수', '#경량', '#포켓디테일'],
  'BAG':      ['#경량', '#수납', '#트레일', '#내구성'],
  'HEADWEAR': ['#UV차단', '#속건', '#경량', '#통기성'],
  'ACC':      ['#기능성', '#경량', '#데일리', '#아웃도어'],
};

// ============ 12자리 제품코드 파서 ============
// S 27 1 0 0 1 H JK 1 1
// 1:브랜드 2-3:연도 4:분기 5:수입(0국/1수) 6:정상(0정) 7:성별(1남/2여/3유니/6용품) 8:라인(H/R) 9-10:아이템 11:주력월 12:고유번호
function parseProductCode(code) {
  if (!code || code.length !== 12) return {};
  return {
    year:    '20' + code.slice(1, 3),
    quarter: code[3],
    imported: code[4] === '1',
    gender: ({'1':'M','2':'W','3':'Uni','6':'Gear'})[code[6]] || '',
    line:   code[7] === 'R' ? 'Running' : (code[7] === 'H' ? 'Hiking' : ''),
    item:   code.slice(8, 10),
    month:  code[10],
  };
}

function buildProducts() {
  const raw = window.PRODUCTS_DATA;
  if (!Array.isArray(raw) || raw.length === 0) {
    console.error('PRODUCTS_DATA is missing — check data/products.js');
    return [];
  }
  const list = [];
  raw.forEach((p, idx) => {
    const cat = p.cat || 'ACC';
    const catDef = CATEGORIES.find(c => c.id === cat) || CATEGORIES[0];
    const parsed = parseProductCode(p.code);
    // 컬러웨이 chip 데이터 (A/B/C/D 제네릭도 중립 스웻치로 표시)
    const PLACEHOLDER_SWATCH = { A:'#cfcfcf', B:'#9fa3a8', C:'#6f7479', D:'#44484c', E:'#222' };
    const colorways = (p.colors || []).map(code => ({
      code: code,
      name: code,
      swatch: PLACEHOLDER_SWATCH[code] || '#888',
      img: null,
    }));
    // 키워드: 엑셀에 있으면 파싱, 없으면 카테고리 기본값
    let keywords = null;
    if (p.kw && typeof p.kw === 'string') {
      keywords = p.kw.split(',').map(s => s.trim()).filter(Boolean);
      if (keywords.length === 0) keywords = null;
    }
    if (!keywords) keywords = SAMPLE_KEYWORDS[cat] || [];
    list.push({
      id: `${cat}-${idx+1}`,
      code: p.code,
      name: p.name || '(이름 없음)',
      cat: cat,
      icon: catDef.icon,
      iconBack: catDef.icon,
      desc: p.desc || SAMPLE_DESC[cat] || '',
      overview: p.overview || null,
      descDetail: p.descDetail || null,
      descItems: p.descItems || null,
      benefit: p.benefit || null,
      price: p.price || 0,
      gender: p.gender || '',
      sport: p.sport || '',
      fit: p.fit || '',
      composition: p.composition || '',
      filling: p.filling || '',
      size: (p.size || '').replace(/\(\d+\)$/, '').trim(),
      season: p.season || '',
      sku: p.sku || '',
      co: p.co || '',
      launch: p.launch || '',
      ds: p.ds || '',
      md: p.md || '',
      sty_col: p.sty_col || '',
      cad: p.cad || '',
      headline: p.headline || '',
      item_name: p.item_name || '',
      pclass: p.pclass || '',
      line: p.line || '',
      keywords: keywords,
      colorways: p.colorways || colorways,
      meta: parsed,
    });
  });
  // 처리된 제품에 자동으로 frames[] 또는 video 연결
  const manifest = window.FRAMES_MANIFEST || {};
  list.forEach(p => {
    const info = manifest[p.code];
    if (!info) return;
    if (info.video) {
      p.video = `web_images/${p.code}/${p.code}.mp4`;
      p.thumb = `web_images/${p.code}/${p.code}.mp4`; // 비디오 썸네일 (첫 프레임 자동 표시)
      p.videoRotation = info.rotation === 'full' ? 'full' : 'half';
      if (typeof info.rotationScale === 'number') p.videoRangeScale = info.rotationScale;
    } else if (info.frames > 0) {
      const n = info.frames;
      p.thumb = `web_images/${p.code}/f_00.jpg`;
      p.frames = Array.from({length: n}, (_, i) => `web_images/${p.code}/f_${String(i).padStart(2,'0')}.jpg`);
    }
  });
  return list;
}

window.__allProducts = PRODUCTS;

// ============ FILTER STATE (multi-select, drag & drop) ============
var filterState = { lines: [], pclasses: [] };
var LINE_MAP = { 'Hiking': '하이킹', 'Running': '러닝', 'Winter': '윈터' };
var CLASS_MAP = { 'APP': '의류', 'ACC': '용품' };

function resetFilters() { filterState.lines = []; filterState.pclasses = []; }

function renderFilterBar(containerId, products, onChange) {
  var bar = document.getElementById(containerId);
  if (!bar) return;
  bar.innerHTML = '';
  bar.className = 'pivot-filter';

  var availLines = {}, availClasses = {};
  products.forEach(function(p) {
    if (p.line) availLines[p.line] = (availLines[p.line] || 0) + 1;
    if (p.pclass) availClasses[p.pclass] = (availClasses[p.pclass] || 0) + 1;
  });
  var lineKeys = Object.keys(availLines).sort();
  var classKeys = Object.keys(availClasses).sort();
  if (lineKeys.length <= 1 && classKeys.length <= 1) return;

  function getArr(type) {
    if (type === 'line') return filterState.lines;
    return filterState.pclasses;
  }
  function addFilter(type, key) {
    var arr = getArr(type);
    if (arr.indexOf(key) === -1) arr.push(key);
  }
  function removeFilter(type, key) {
    var arr = getArr(type);
    var idx = arr.indexOf(key);
    if (idx >= 0) arr.splice(idx, 1);
  }

  function makeChip(type, key, label, count, isActive) {
    var chip = document.createElement('div');
    chip.className = 'pivot-chip ' + (isActive ? 'active-chip ' : 'pool-chip ') + (type === 'line' ? 'line-chip' : type === 'class' ? 'class-chip' : 'md-chip');
    chip.setAttribute('draggable', 'true');
    chip.setAttribute('data-type', type);
    chip.setAttribute('data-key', key);
    chip.textContent = label + ' (' + count + ')';
    if (isActive) {
      var x = document.createElement('span');
      x.className = 'chip-x'; x.textContent = '×';
      x.addEventListener('click', function(e) { e.stopPropagation(); removeFilter(type, key); onChange(); });
      chip.appendChild(x);
    }
    chip.addEventListener('dragstart', function(e) {
      e.dataTransfer.setData('text/plain', type + ':' + key + ':' + (isActive ? '1' : '0'));
      chip.classList.add('dragging');
    });
    chip.addEventListener('dragend', function() { chip.classList.remove('dragging'); });
    // Touch: simple tap to toggle
    chip.addEventListener('click', function() {
      if (isActive) removeFilter(type, key); else addFilter(type, key);
      onChange();
    });
    return chip;
  }

  function buildRow(rowLabel, keys, map, type, avail) {
    if (keys.length <= 1) return;
    var activeArr = type === 'line' ? filterState.lines : type === 'class' ? filterState.pclasses : filterState.mds;

    var row = document.createElement('div'); row.className = 'pivot-row';

    // Header: label
    var hdr = document.createElement('div'); hdr.className = 'pivot-row-header';
    var lbl = document.createElement('div'); lbl.className = 'pivot-row-label'; lbl.textContent = rowLabel;
    hdr.appendChild(lbl);
    row.appendChild(hdr);

    // Drop zone (active)
    var zone = document.createElement('div'); zone.className = 'pivot-drop-zone';
    var hasActive = false;
    keys.forEach(function(k) {
      if (activeArr.indexOf(k) >= 0) {
        zone.appendChild(makeChip(type, k, map[k] || k, avail[k], true));
        hasActive = true;
      }
    });
    if (!hasActive) {
      var hint = document.createElement('span');
      hint.className = 'pivot-drop-zone-hint';
      hint.textContent = '여기로 드래그하여 필터 적용';
      zone.appendChild(hint);
    }
    zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', function() { zone.classList.remove('drag-over'); });
    zone.addEventListener('drop', function(e) {
      e.preventDefault(); zone.classList.remove('drag-over');
      var d = (e.dataTransfer.getData('text/plain') || '').split(':');
      if (d.length < 3) return;
      if (d[0] === type && d[2] === '0') { addFilter(type, d[1]); onChange(); }
    });
    row.appendChild(zone);

    // Pool (inactive)
    var inactiveKeys = keys.filter(function(k) { return activeArr.indexOf(k) < 0; });
    if (inactiveKeys.length > 0) {
      var pool = document.createElement('div'); pool.className = 'pivot-pool';
      inactiveKeys.forEach(function(k) {
        pool.appendChild(makeChip(type, k, map[k] || k, avail[k], false));
      });
      pool.addEventListener('dragover', function(e) { e.preventDefault(); });
      pool.addEventListener('drop', function(e) {
        e.preventDefault();
        var d = (e.dataTransfer.getData('text/plain') || '').split(':');
        if (d.length < 3) return;
        if (d[0] === type && d[2] === '1') { removeFilter(type, d[1]); onChange(); }
      });
      row.appendChild(pool);
    }

    bar.appendChild(row);
  }

  buildRow('LINE', lineKeys, LINE_MAP, 'line', availLines);
  buildRow('CLASS', classKeys, CLASS_MAP, 'class', availClasses);

}

function applyFilter(products) {
  return products.filter(function(p) {
    if (filterState.lines.length > 0 && filterState.lines.indexOf(p.line) === -1) return false;
    if (filterState.pclasses.length > 0 && filterState.pclasses.indexOf(p.pclass) === -1) return false;
    return true;
  });
}

function renderStaffCards(prods, grid) {
  prods.forEach(function(p) {
    var card = document.createElement('div');

      : (p.frames && p.frames[0])
        ? '<img src="' + p.frames[0] + '" alt="' + p.name + '" loading="lazy">'
        : p.icon;
    var unanswered = getUnansweredCount(p.id);
    var badge = unanswered > 0 ? '<span class="badge-inquiry">' + unanswered + '</span>' : '';
    var cwCount = (p.colorways && p.colorways.length) ? p.colorways.length : 0;
    var priceStr = p.price ? '₩' + Number(p.price).toLocaleString('ko-KR') : '';
    var colorDots = (p.colorways || []).slice(0, 5).map(function(cw) {
      return '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + colorNameToHex(cw.color_name) + ';border:1px solid rgba(0,0,0,.1);"></span>';
    }).join('');
    var moreColors = cwCount > 5 ? '<span style="font-size:9px;color:#999;">+' + (cwCount-5) + '</span>' : '';
    card.innerHTML = '<div class="thumb">' + thumbContent + '</div>'
      + '<div class="info">'
      + '<div class="name">' + p.name + badge + '</div>'
      + '<div class="meta" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">'
      + '<span>' + p.code + '</span>'
      + (priceStr ? '<span style="color:#2E75B6;font-weight:600;">' + priceStr + '</span>' : '')
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:3px;margin-top:2px;">' + colorDots + moreColors + '</div>'
      + '</div>';
    grid.appendChild(card);
  });
}

// ============ GOOGLE SHEETS API ============
const API_URL = 'https://script.google.com/macros/s/AKfycbxQYi9faQBCmYXlf849V3O2aKsopDQRvzILzVKK7DJF-MzKGstRHCGC5iexWym8BFu4/exec';

async function loadFeedbacks() {
  try {
    const res = await fetch(API_URL, { method: 'GET' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state.feedbacks = (Array.isArray(data) ? data : []).map(f => ({
      user: f.user || '',
      productId: f.productId || '',
      productName: f.productName || '',
      ratings: (typeof f.ratings === 'object' && f.ratings) ? f.ratings : {},
      tagsNeg: Array.isArray(f.tagsNeg) ? f.tagsNeg : [],
      tagsPos: Array.isArray(f.tagsPos) ? f.tagsPos : [],
      markers: Array.isArray(f.markers) ? f.markers : [],
      comment: f.comment || '',
      timestamp: f.timestamp || '',
    }));
    return true;
  } catch (e) {
    console.error('loadFeedbacks failed', e);
    return false;
  }
}

async function pushFeedback(entry) {
  try {
    // text/plain to avoid CORS preflight; Apps Script reads e.postData.contents
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(entry),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    });
    return true;
  } catch (e) {
    console.error('pushFeedback failed', e);
    return false;
  }
}

let _loginBusy = false;
async function pinLogin() {
  if (_loginBusy) return;
  _loginBusy = true;
  const btn = document.getElementById('btnLogin');
  if (btn) { btn.disabled = true; btn.textContent = '로그인 중...'; }
  try {
    const email = (document.getElementById('emailInput').value || '').trim().toLowerCase();
    const pin = (document.getElementById('pinInput').value || '').trim();
    if (!email || !email.includes('@')) {
      toast('올바른 이메일을 입력하세요');
      return;
    }
    if (pin.length !== 6) {
      toast('6자리 PIN을 입력하세요');
      return;
    }
    const isAdmin = getAdmins().some(a => a.email === email && a.pin === pin);
    const isUser = (pin === getUserPin());
    if (!isAdmin && !isUser) {
      toast('PIN이 올바르지 않습니다');
      return;
    }
    state.user = email;
    state.isAdmin = isAdmin;
    var _un = document.getElementById('userName'); if (_un) _un.textContent = email;
    await loadFeedbacks();
    showSeasons();
    toast(isAdmin ? '관리자 로그인 완료' : '로그인 완료');

    if (isAdmin) {
      document.querySelectorAll('.search-bar input').forEach(function(el) {
        el.placeholder = '제품명, 국내품번 또는 담당자(MD/DS) 검색';
      });
    }
  } catch (e) {
    alert('로그인 오류: ' + e.message);
  } finally {
    _loginBusy = false;
    if (btn) { btn.disabled = false; btn.textContent = '로그인'; }
  }
}

// 헬퍼: 현재 사용자의 특정 제품 피드백 찾기
function myFeedback(productId) {
  return state.feedbacks.find(f => f.productId === productId && f.user === state.user);
}
// 헬퍼: 특정 제품의 모든 피드백
function feedbacksFor(productId) {
  return state.feedbacks.filter(f => f.productId === productId);
}



// ============ PRODUCT LIST ============
function renderProductList(itemNameFilter) {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '';
  const cat = CATEGORIES.find(c => c.id === state.currentCategory);
  var allProds = PRODUCTS.filter(p => p.cat === state.currentCategory);
  if (itemNameFilter) {
    allProds = allProds.filter(p => (p.item_name || '기타') === itemNameFilter);
  }
  var prods = applyFilter(allProds);
  renderFilterBar('listFilterBar', allProds, function() { renderProductList(itemNameFilter); });
  document.getElementById('listTitle').textContent = itemNameFilter || (cat ? cat.name : '제품 목록');
  document.getElementById('listSubtitle').textContent = `${prods.length}개 제품`;

  prods.forEach(p => {
    const isDone = !!myFeedback(p.id);
    const card = document.createElement('div');
    card.className = 'product-card';
    card.onclick = () => openProduct(p.id);
    const thumbContent = p.video
      ? `<video src="${p.video}#t=0.001" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover;"></video>`
      : (p.frames && p.frames[0])
        ? `<img src="${p.frames[0]}" alt="${p.name}" loading="lazy">`
        : p.icon;
    const unanswered = getUnansweredCount(p.id);
    const badge = unanswered > 0 ? `<span class="badge-inquiry">${unanswered}</span>` : '';
    const cwCount = (p.colorways && p.colorways.length) ? p.colorways.length : (p.colors ? p.colors.length : 0);
    const priceStr = p.price ? `₩${Number(p.price).toLocaleString('ko-KR')}` : '';
    const colorDots = (p.colorways || []).slice(0, 5).map(cw =>
      `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colorNameToHex(cw.color_name)};border:1px solid rgba(0,0,0,.1);"></span>`
    ).join('');
    const moreColors = cwCount > 5 ? `<span style="font-size:9px;color:#999;">+${cwCount-5}</span>` : '';
    card.innerHTML = `
      <div class="thumb">${thumbContent}</div>
      <div class="info">
        <div class="name">${p.name}${badge}</div>
        <div class="meta" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <span style="font-size:11px;color:#999;">${priceStr}</span>
          <span style="display:flex;align-items:center;gap:2px;">${colorDots}${moreColors}</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

    'CORAL':'#ff6f61','MINT':'#98d4bb','TEAL':'#008080',
    'BURGUNDY':'#800020','WINE':'#722f37','PLUM':'#8e4585',

    'PEACH':'#ffcba4','APRICOT':'#fbceb1',
    'ACORN':'#8b6d4e','BUTTER':'#f5e6a8','CASTLE ROCK':'#6e6e6e',
    'CHOCOLATE':'#4a2c2a','COOL':'#8899aa','CYAN':'#00bcd4',
    'ETHEREA':'#c9b8d9','IRON':'#6b6b6b','ICE':'#d6ecf0',
    'JACQUARD':'#1a1a1a','MELANGE':'#888888','PATTERN':'#aab0b8',
    'OFF WHITE':'#f0ece0','PUSSYWILLOW':'#b0a898','ROYAL BLUE':'#4169e1',

// ============ PRODUCT DETAIL ============
function openProduct(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (state.currentProduct && state.currentProduct.id !== id) {
    if (!state.productHistory) state.productHistory = [];
    state.productHistory.push(state.currentProduct.id);
  }
  state.currentProduct = p;
  state.current = {
    ratings: {},
    tagsPos: new Set(),
    tagsNeg: new Set(),
    markers: [],
    comment: '',
  };

  // Load existing if any
  const existing = myFeedback(id);
  if (existing) {
    state.current.ratings = { ...existing.ratings };
    state.current.tagsPos = new Set(existing.tagsPos);
    state.current.tagsNeg = new Set(existing.tagsNeg);
    state.current.markers = existing.markers.map(m => ({ ...m }));
    state.current.comment = existing.comment || '';
  }

  const catDef = CATEGORIES.find(c => c.id === p.cat);
  document.getElementById('pdName').textContent = p.name;
  document.getElementById('pdMeta').textContent = `${p.code.substring(0,12)} · ${catDef ? catDef.name : ''}`;
  // Render structured description
    applyDescEdits(p);
    const ov = document.getElementById('pdOverview');
    const di = document.getElementById('pdDescItems');
    const bn = document.getElementById('pdBenefit');
    const dd = document.getElementById('pdDesc');
    ov.textContent = ''; di.innerHTML = ''; if (bn) bn.innerHTML = ''; if (dd) dd.textContent = '';
    if (p.overview) { ov.textContent = p.overview; ov.style.display = ''; } else { ov.style.display = 'none'; }
    renderPictoCards(p);
    renderSetupItems(p);
    if (p.descItems && p.descItems.length) {
      di.style.display = '';
      p.descItems.forEach(d => {
        const item = document.createElement('div'); item.className = 'pd-desc-item';
        const t = document.createElement('div'); t.className = 'pd-desc-item-title'; t.textContent = d.title;
        const c = document.createElement('div'); c.className = 'pd-desc-item-content'; c.textContent = d.content;
        item.appendChild(t); item.appendChild(c); di.appendChild(item);
      });
    } else { di.style.display = 'none'; }

    renderComments();
    // Show admin edit button
    const editBtn = document.getElementById('btnEditDesc');
    if (editBtn) editBtn.style.display = state.isAdmin ? '' : 'none';
    const editSec = document.getElementById('adminEditSection');
    if (editSec) editSec.style.display = 'none';
  var wm = document.getElementById('imgWatermark');
  if (wm) {
    wm.innerHTML = '';
    var email = state.user || '';
    if (email) {
      var rows = 8;
      for (var ri = 0; ri < rows; ri++) {
        var line = document.createElement('div');
        line.style.cssText = 'white-space:nowrap;font-size:12px;font-weight:600;color:rgba(0,0,0,0.06);letter-spacing:1px;transform:rotate(-30deg);position:absolute;width:300%;left:-50%;';
        line.style.top = (ri * 13 - 5) + '%';
        var txt = '';
        for (var ci = 0; ci < 10; ci++) txt += email + '    ';
        line.textContent = txt;
        wm.appendChild(line);
      }
    }
  }

  var launchEl = document.getElementById('pdLaunch');
  if (launchEl) launchEl.textContent = p.launch ? '출시 ' + p.launch : '';

  document.getElementById('pdPrice').textContent = p.price
    ? `₩${p.price.toLocaleString('ko-KR')}` : '—';
  const kwWrap = document.getElementById('pdKeywords');
  kwWrap.innerHTML = '';
  (p.keywords || []).forEach(k => {
    const el = document.createElement('span');
    el.className = 'kw';
    el.textContent = k;
    kwWrap.appendChild(el);
  });

  // Render product spec grid
  const specGrid = document.getElementById('pdSpecGrid');
  specGrid.innerHTML = '';
  const MATERIAL_MAP = {
    N:'Nylon', P:'Polyester', C:'Cotton', SP:'Spandex',
    E:'Elastane', W:'Wool', WO:'Wool', A:'Acrylic',
    R:'Recycled Polyester', REP:'Recycled Polyester',
    PU:'Polyurethane', AN:'Aramid', DY:'Dyneema'
  };
  function parseComposition(code) {
    if (!code) return '';
    return code.split(/[\/\s]+/).map(function(part) {
      var m = part.match(/^([A-Z]+)(\d+)$/);
      if (!m) return part;
      return (MATERIAL_MAP[m[1]] || m[1]) + ' ' + m[2] + '%';
    }).join(' / ');
  }
  const specFields = [
    { label: '성별', val: p.gender },
    { label: '스포츠', val: p.sport },
    { label: '핏', val: p.fit },
    { label: '혼용률', val: parseComposition(p.composition) },
    { label: '충전재', val: p.filling },
  ];
  specFields.forEach(sf => {
    if (!sf.val) return;
    const d = document.createElement('div'); d.className = 'spec-item';
    d.innerHTML = '<span class="spec-label">' + sf.label + '</span><span class="spec-val">' + sf.val + '</span>';
    specGrid.appendChild(d);
  });

  // Render colorway table
  // Size chart button
  var sizeChartArea = document.getElementById('pdSizeChartArea');
  if (sizeChartArea) {
    sizeChartArea.innerHTML = '<button class="btn-size-chart" onclick="openSizeChart(\'' + p.code + '\')">📏 사이즈 차트</button>';
  }

  const cwBody = document.getElementById('pdColorwayBody');
  cwBody.innerHTML = '';
  const cwSec = document.getElementById('pdColorwaySection');
  if (p.colorways && p.colorways.length) {
    cwSec.style.display = 'block';
    p.colorways.forEach(cw => {
      const tr = document.createElement('tr');
      const colorHex = colorNameToHex(cw.color_name || '');
      var cwSize = cw.size || p.size || '-';
      tr.innerHTML = '<td><span class="color-dot" style="background:' + colorHex + ';"></span>' + (cw.color_name || '-') + '</td>'
        + '<td class="lc-code">' + (cw.lc || '-') + '</td>'
        + '<td style="font-size:11px;color:#555;">' + cwSize + '</td>';
      cwBody.appendChild(tr);
    });
  } else {
    cwSec.style.display = 'none';
  }

  // Display product image (front ghost cut)
  const imgArea = document.getElementById('productImageArea');
  const imgPlaceholder = document.getElementById('productImgPlaceholder');
  if (p.frames && p.frames.length && p.frames[0]) {
    imgArea.innerHTML = '<img src="' + p.frames[0] + '" alt="" style="max-width:88%;max-height:88%;object-fit:contain;filter:drop-shadow(0 18px 26px rgba(0,0,0,0.35));">';
  } else {
    imgArea.innerHTML = '';
    imgPlaceholder.textContent = p.icon;
    imgArea.appendChild(imgPlaceholder);
  }

  renderColorways();
  showScreen('screen-detail');
}

function renderColorways() {
  const chips = document.getElementById('pdColorChips');
  chips.innerHTML = '';
  const p = state.currentProduct;
  const list = (p && p.colorways) || [];
  // Always hide overlay first
  document.getElementById('colorwayOverlay').style.display = 'none';
  state.colorwayIdx = -1;
  if (!list.length) return;

  // "기본" chip — returns to 360 viewer
  const defaultBtn = document.createElement('button');
  defaultBtn.className = 'pd-chip active';
  defaultBtn.dataset.idx = '-1';
  defaultBtn.textContent = '기본';
  defaultBtn.onclick = () => selectColorway(-1);
  chips.appendChild(defaultBtn);

  list.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'pd-chip';
    btn.dataset.idx = String(i);
    const swatchColor = c.swatch || colorNameToHex(c.color_name || c.name || '');
    const chipLabel = c.color_name || c.name || c.code || '';
    btn.innerHTML = `<span class="swatch" style="background:${swatchColor}"></span>`;
    btn.onclick = () => selectColorway(i);
    chips.appendChild(btn);
  });
}

function selectColorway(i) {
  const p = state.currentProduct;
  if (!p) return;
  const overlay = document.getElementById('colorwayOverlay');
  state.colorwayIdx = i;

  document.querySelectorAll('#pdColorChips .pd-chip').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === i);
  });

  if (i < 0 || !p.colorways || !p.colorways[i]) {
    overlay.style.display = 'none';
    return;
  }
  const c = p.colorways[i];
  document.getElementById('colorwayImg').src = c.img;
  document.getElementById('colorwayImg').alt = c.code;
  document.getElementById('colorwayCode').textContent = c.code;
  overlay.style.display = 'flex';
}

function logout() {
  state.user = null;

  state.currentProduct = null;
  state.currentCategory = null;

  if (pinEl) pinEl.value = '';

}

function renderRatings() {
  const container = document.getElementById('ratingsContainer');
  container.innerHTML = '';
  RATING_ITEMS.forEach(item => {
    const val = state.current.ratings[item] || 0;
    const row = document.createElement('div');
    row.className = 'rating-row';
    row.innerHTML = `
      <span class="rating-label">${item}</span>
      <div class="stars" data-item="${item}">
        ${[1,2,3,4,5].map(n =>
          `<span class="star ${n <= val ? 'filled' : ''}" data-val="${n}">★</span>`
        ).join('')}
      </div>
    `;
    container.appendChild(row);
  });
  container.querySelectorAll('.stars').forEach(stars => {
    stars.querySelectorAll('.star').forEach(star => {
      star.onclick = () => {
        const item = stars.dataset.item;
        const val = parseInt(star.dataset.val);
        state.current.ratings[item] = val;
        renderRatings();
      };
    });
  });
}

function renderTags() {
  const pos = document.getElementById('tagsPositive');
  const neg = document.getElementById('tagsNegative');
  pos.innerHTML = '';
  neg.innerHTML = '';
  TAGS_POS.forEach(t => {
    const el = document.createElement('span');
    el.className = 'tag' + (state.current.tagsPos.has(t) ? ' selected' : '');
    el.textContent = t;
    el.onclick = () => {
      if (state.current.tagsPos.has(t)) state.current.tagsPos.delete(t);
      else state.current.tagsPos.add(t);
      renderTags();
    };
    pos.appendChild(el);
  });
  TAGS_NEG.forEach(t => {
    const el = document.createElement('span');
    el.className = 'tag' + (state.current.tagsNeg.has(t) ? ' selected negative' : '');
    el.textContent = t;
    el.onclick = () => {
      if (state.current.tagsNeg.has(t)) state.current.tagsNeg.delete(t);
      else state.current.tagsNeg.add(t);
      renderTags();
    };
    neg.appendChild(el);
  });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showAdmin() {
  if (!state.isAdmin) { toast('관리자 권한이 필요합니다'); return; }
  const feedbacks = state.feedbacks;
  document.getElementById('adminTotal').textContent = feedbacks.length;
  let totalStars = 0, starCount = 0;
  feedbacks.forEach(f => {
    Object.values(f.ratings).forEach(v => { totalStars += v; starCount++; });
  });
  document.getElementById('adminAvg').textContent =
    starCount > 0 ? (totalStars / starCount).toFixed(1) : '0.0';

  const list = document.getElementById('adminProductList');
  list.innerHTML = '';
  PRODUCTS.forEach(p => {
    const fbs = feedbacksFor(p.id);
    const card = document.createElement('div');
    card.className = 'admin-prod-card' + (fbs.length ? '' : ' empty');
    const thumb = p.video
      ? `<video src="${p.video}#t=0.001" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover;"></video>`
      : (p.frames && p.frames[0])
        ? `<img src="${p.frames[0]}" alt="">`
        : `<span>${p.icon}</span>`;
    if (fbs.length) {
      let totS = 0, cntS = 0;
      fbs.forEach(f => Object.values(f.ratings).forEach(v => { totS += v; cntS++; }));
      const avg = cntS ? (totS / cntS).toFixed(1) : '—';
      const negCount = fbs.reduce((a,f) => a + f.tagsNeg.length, 0);
      const markerCount = fbs.reduce((a,f) => a + f.markers.length, 0);
      card.innerHTML = `
        <div class="apc-thumb">${thumb}</div>
        <div class="apc-info">
          <div class="apc-name">${p.name}</div>
          <div class="apc-meta">${p.code}</div>
          <div class="apc-stats">👥 ${fbs.length}명 · ⭐ ${avg} · 🔧 ${negCount} · 📍 ${markerCount}</div>
        </div>
        <div class="apc-arrow">›</div>
      `;
      card.onclick = () => showAdminProduct(p.id);
    } else {
      card.innerHTML = `
        <div class="apc-thumb">${thumb}</div>
        <div class="apc-info">
          <div class="apc-name" style="color:#aaa;">${p.name}</div>
          <div class="apc-meta">${p.code}</div>
          <div class="apc-stats" style="color:#bbb;">아직 피드백 없음</div>
        </div>
      `;
    }
    list.appendChild(card);
  });
  showScreen('screen-admin');
}

function showAdminProduct(productId) {
  const p = PRODUCTS.find(x => x.id === productId);
  if (!p) return;
  state.adminProductId = productId;
  const fbs = feedbacksFor(productId);
  document.getElementById('apdName').textContent = p.name;
  document.getElementById('apdCode').textContent = p.code;
  document.getElementById('apdCount').textContent = `${fbs.length}명 응답`;
  const apdThumb = document.getElementById('apdThumb');
  apdThumb.innerHTML = (p.frames && p.frames[0])
    ? `<img src="${p.frames[0]}" alt="${p.name}">`
    : `<span>${p.icon}</span>`;

  const aggBox = document.getElementById('apdAgg');
  if (!fbs.length) {
    aggBox.innerHTML = '<div style="color:#999; font-size:13px;">아직 피드백이 없습니다.</div>';
    document.getElementById('apdList').innerHTML = '';
    showScreen('screen-admin-detail');
    return;
  }
  const ratingAgg = {};
  RATING_ITEMS.forEach(it => { ratingAgg[it] = { sum: 0, n: 0 }; });
  fbs.forEach(f => {
    Object.entries(f.ratings).forEach(([k,v]) => {
      if (ratingAgg[k]) { ratingAgg[k].sum += v; ratingAgg[k].n += 1; }
    });
  });
  const ratingHtml = RATING_ITEMS.map(it => {
    const a = ratingAgg[it];
    const avg = a.n ? (a.sum / a.n).toFixed(1) : '—';
    const pct = a.n ? (a.sum / a.n) / 5 * 100 : 0;
    return `
      <div class="agg-row">
        <div class="agg-label">${it}</div>
        <div class="agg-bar"><div class="agg-bar-fill" style="width:${pct}%"></div></div>
        <div class="agg-val">${avg}</div>
      </div>`;
  }).join('');
  const tagTally = {};
  fbs.forEach(f => f.tagsNeg.forEach(t => { tagTally[t] = (tagTally[t]||0) + 1; }));
  const sortedTags = Object.entries(tagTally).sort((a,b) => b[1]-a[1]);
  const tagHtml = sortedTags.length
    ? `<div class="agg-tags">${sortedTags.map(([t,c]) => `<span class="agg-tag">${t} <b>${c}</b></span>`).join('')}</div>`
    : '<div style="font-size:12px; color:#aaa;">개선 태그 없음</div>';
  aggBox.innerHTML = `
    <div class="agg-section-title">항목별 평균</div>
    ${ratingHtml}
    <div class="agg-section-title" style="margin-top:14px;">개선 필요 태그</div>
    ${tagHtml}
  `;

  const listEl = document.getElementById('apdList');
  listEl.innerHTML = '';
  fbs.slice().sort((a,b) => (b.timestamp||'').localeCompare(a.timestamp||'')).forEach(f => {
    const item = document.createElement('div');
    item.className = 'fb-item';
    const ratings = Object.entries(f.ratings).map(([k,v]) => `${k} ${'★'.repeat(v)}${'☆'.repeat(5-v)}`).join(' · ');
    const negTags = f.tagsNeg.length ? f.tagsNeg.map(t => `<span class="fb-tag">${t}</span>`).join('') : '';
    const markers = f.markers.length
      ? '<div class="fb-markers">' + f.markers.map(m => {
          const angle = (m.frame !== undefined && ANGLE_LABELS[m.frame]) ? `[${ANGLE_LABELS[m.frame]}] ` : '';
          return `<div>📍 ${angle}${escapeHtml(m.text || '')}</div>`;
        }).join('') + '</div>'
      : '';
    const time = f.timestamp ? new Date(f.timestamp).toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
    item.innerHTML = `
      <div class="fb-head">
        <div class="fb-user">${escapeHtml(f.user || '익명')}</div>
        <div class="fb-time">${time}</div>
      </div>
      <div class="fb-ratings">${ratings || '<span style="color:#bbb;">평가 없음</span>'}</div>
      ${negTags ? `<div class="fb-tags">${negTags}</div>` : ''}
      ${f.comment ? `<div class="fb-comment">"${escapeHtml(f.comment)}"</div>` : ''}
      ${markers}
    `;
    listEl.appendChild(item);
  });
  showScreen('screen-admin-detail');
}

function exportXLSX() {
  if (typeof XLSX === 'undefined') { toast('엑셀 라이브러리 로드 실패'); return; }
  if (!state.feedbacks.length) { toast('내보낼 피드백이 없습니다'); return; }
  const allRatingItems = RATING_ITEMS;
  const rows = state.feedbacks.map(f => {
    const row = {
      '제출시각': f.timestamp ? new Date(f.timestamp).toLocaleString('ko-KR') : '',
      '사용자': f.user || '',
      '제품ID': f.productId || '',
      '제품명': f.productName || '',
    };
    allRatingItems.forEach(it => { row[`평점_${it}`] = f.ratings[it] || ''; });
    row['평균평점'] = (() => {
      const vals = Object.values(f.ratings);
      return vals.length ? (vals.reduce((a,b) => a+b, 0) / vals.length).toFixed(2) : '';
    })();
    row['개선태그'] = (f.tagsNeg || []).join(', ');
    row['코멘트'] = f.comment || '';
    row['마커수'] = (f.markers || []).length;
    row['마커상세'] = (f.markers || []).map(m => {
      const ang = (m.frame !== undefined && ANGLE_LABELS[m.frame]) ? `[${ANGLE_LABELS[m.frame]}]` : '';
      return `${ang}${m.text || ''}`;
    }).join(' | ');
    return row;
  });
  const prodRows = PRODUCTS.map(p => {
    const fbs = feedbacksFor(p.id);
    const row = { '제품ID': p.id, '제품명': p.name, '제품코드': p.code, '응답수': fbs.length };
    allRatingItems.forEach(it => {
      const vals = fbs.map(f => f.ratings[it]).filter(v => v != null);
      row[`평균_${it}`] = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2) : '';
    });
    const negTally = {};
    fbs.forEach(f => f.tagsNeg.forEach(t => { negTally[t] = (negTally[t]||0)+1; }));
    row['개선태그집계'] = Object.entries(negTally).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`${t}(${c})`).join(', ');
    row['총마커수'] = fbs.reduce((a,f)=>a+f.markers.length, 0);
    return row;
  }).filter(r => r['응답수'] > 0);

  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.json_to_sheet(rows);
  const ws2 = XLSX.utils.json_to_sheet(prodRows);
  XLSX.utils.book_append_sheet(wb, ws1, '응답 raw');
  XLSX.utils.book_append_sheet(wb, ws2, '제품별 집계');
  const today = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `convention-feedback_${today}.xlsx`);
  toast('엑셀 다운로드 시작');
}

function getComments(productId) {
  const all = JSON.parse(localStorage.getItem('wb_comments') || '{}');
  return all[productId] || [];
}
function saveComments(productId, comments) {
  const all = JSON.parse(localStorage.getItem('wb_comments') || '{}');
  all[productId] = comments;
  localStorage.setItem('wb_comments', JSON.stringify(all));
}
function getUnansweredCount(productId) {
  const comments = getComments(productId);
  return comments.filter(c => !c.replies || c.replies.length === 0).length;
}
function renderComments() {
  const p = state.currentProduct;
  if (!p) return;
  const list = document.getElementById('commentsList');
  const comments = getComments(p.id);
  if (!comments.length) {
    list.innerHTML = '<p style="font-size:12px; color:#bbb;">아직 문의사항이 없습니다.</p>';
    return;
  }
  list.innerHTML = comments.map((c, i) => {
    const delBtn = (state.isAdmin || c.author === state.user)
      ? '<span class="comment-delete" onclick="deleteComment(' + i + ')">삭제</span>' : '';
    const replies = (c.replies || []).map((r, ri) => {
      const rDel = (state.isAdmin || r.author === state.user)
        ? '<span class="comment-delete" onclick="deleteReply(' + i + ',' + ri + ')">삭제</span>' : '';
      return '<div class="reply-item">'
        + '<div class="comment-header"><span class="comment-author">↳ ' + r.author + '</span>'
        + '<span><span class="comment-date">' + new Date(r.ts).toLocaleDateString('ko-KR') + '</span>' + rDel + '</span></div>'
        + '<div class="comment-body">' + r.text.replace(/</g,'&lt;').replace(/\n/g,'<br>') + '</div></div>';
    }).join('');
    const replyInput = state.isAdmin ? '<div class="reply-input" style="display:flex; gap:6px; margin-top:6px; align-items:flex-end;">'
      + '<textarea class="input" id="reply-' + i + '" placeholder="답변 입력" rows="1" style="flex:1; margin:0; font-size:12px; padding:6px 8px; min-height:32px;"></textarea>'
      + '<button class="btn" style="font-size:11px; padding:6px 8px; margin:0; width:40px;" onclick="postReply(' + i + ')">답변</button></div>' : '';
    const noReply = (!c.replies || c.replies.length === 0) ? ' no-reply' : '';
    return '<div class="comment-item' + noReply + '">'
      + '<div class="comment-header"><span class="comment-author">' + c.author + '</span>'
      + '<span><span class="comment-date">' + new Date(c.ts).toLocaleDateString('ko-KR') + '</span>' + delBtn + '</span></div>'
      + '<div class="comment-body">' + c.text.replace(/</g,'&lt;').replace(/\n/g,'<br>') + '</div>'
      + replies + replyInput + '</div>';
  }).join('');
}
function postComment() {
  const text = document.getElementById('newComment').value.trim();
  if (!text) { toast('문의사항을 입력하세요'); return; }
  const p = state.currentProduct;
  const comments = getComments(p.id);
  comments.push({ author: state.user, text: text, ts: new Date().toISOString() });
  saveComments(p.id, comments);
  document.getElementById('newComment').value = '';
  renderComments();
  toast('등록되었습니다');
}
function deleteComment(idx) {
  const p = state.currentProduct;
  const comments = getComments(p.id);
  comments.splice(idx, 1);
  saveComments(p.id, comments);
  renderComments();
  toast('삭제되었습니다');
}
function postReply(commentIdx) {
  const input = document.getElementById('reply-' + commentIdx);
  const text = input.value.trim();
  if (!text) { toast('답변을 입력하세요'); return; }
  const p = state.currentProduct;
  const comments = getComments(p.id);
  if (!comments[commentIdx].replies) comments[commentIdx].replies = [];
  comments[commentIdx].replies.push({ author: state.user, text: text, ts: new Date().toISOString() });
  saveComments(p.id, comments);
  input.value = '';
  renderComments();
  toast('답변이 등록되었습니다');
}
function deleteReply(commentIdx, replyIdx) {
  const p = state.currentProduct;
  const comments = getComments(p.id);
  comments[commentIdx].replies.splice(replyIdx, 1);
  saveComments(p.id, comments);
  renderComments();
  toast('삭제되었습니다');
}

async function generateDescWithAI() {
  const p = state.currentProduct;
  const keywords = document.getElementById('editKeywords').value.trim();
  const sport = document.getElementById('editSport').value.trim() || p.sport || '';
  const name = p.name || '';
  const gender = document.getElementById('editGender').value.trim() || p.gender || '';
  const fit = document.getElementById('editFit').value.trim() || p.fit || '';
  const composition = document.getElementById('editComposition').value.trim() || p.composition || '';
  const filling = document.getElementById('editFilling').value.trim() || p.filling || '';

  const btn = document.getElementById('btnGenerateDesc');
  const status = document.getElementById('aiGenerateStatus');
  btn.disabled = true;
  btn.textContent = '생성 중...';
  status.style.display = 'block';

  const isRunning = sport.toLowerCase().includes('running');
  const isHiking = sport.toLowerCase().includes('hiking');
  const toneName = isRunning ? 'Running 기술형' : isHiking ? 'Hiking 간결형' : '기본형';
  const toneBlock = isRunning ? TONE_RUNNING : isHiking ? TONE_HIKING : TONE_DEFAULT;

  const systemPrompt = SYSTEM_PROMPT_BASE + toneBlock;

  const userPrompt = `아래 제품 정보를 바탕으로 한국어 제품 설명을 작성하세요.

제품 정보:
- 제품명: ${name}
- 카테고리: ${sport || '아웃도어'}
- 성별: ${gender}
- 핏: ${fit}
- 혼용률: ${composition}
- 충전재: ${filling || '없음'}
- 핵심 키워드: ${keywords || '(없음 — 제품명과 스펙 기반으로 보수적으로 작성)'}

반드시 아래 JSON 형식으로만 응답하세요. 마크다운, 설명, 주석 없이 JSON만 출력합니다:
{
  "overview": "제품 전체 소개",
  "descItems": [
    {"title": "소제목1", "content": "내용1"},
    {"title": "소제목2", "content": "내용2"},
    {"title": "소제목3", "content": "내용3"}
  ]
}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: 'user', content: userPrompt }]
      })
    });
    const data = await res.json();
    const text = data.content.map(i => i.text || '').join('');

function getIconForKeyword(kw) {
  const lower = kw.toLowerCase();
  for (const p of PICTO_MAP) {
    if (p.keys.some(k => lower.includes(k.toLowerCase()))) return p;
  }
  return {
    icon: `<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="11"/><path d="M20 15 L20 21"/><circle cx="20" cy="25" r="1"/></svg>`,
    label: kw
  };
}

function renderPictoCards(p) {
  const container = document.getElementById('pdPictoCards');
  if (!container) return;
  const keywords = p.keywords && p.keywords.length ? p.keywords : [];
  if (!keywords.length) { container.style.display = 'none'; return; }

  const cols = keywords.length <= 2 ? keywords.length : keywords.length <= 4 ? 2 : keywords.length <= 6 ? 3 : 4;
  container.innerHTML = '';
  container.style.display = '';
  container.style.cssText = `display:grid; grid-template-columns:repeat(${cols}, 1fr); gap:8px; margin-bottom:16px;`;

  keywords.forEach((kw, i) => {
    const match = getIconForKeyword(kw);
    const descItem = p.descItems && p.descItems[i];
    const oneliner = descItem ? descItem.content.split(/[.。]/)[0].trim() : kw;

    const card = document.createElement('div');
    card.style.cssText = 'background:#f8f9fa; border:1px solid #eee; border-radius:10px; padding:14px 10px; text-align:center;';
    card.innerHTML = `
      <div style="width:40px;height:40px;margin:0 auto 8px;color:#333;">${match.icon}</div>
      <div style="font-size:12px;font-weight:600;color:#222;margin-bottom:4px;line-height:1.3;">${kw}</div>
      <div style="font-size:11px;color:#666;line-height:1.4;">${oneliner}</div>
    `;
    container.appendChild(card);
  });
}

function addDescItemRow(title, content) {

function saveDescEdit() {
  const p = state.currentProduct;
  p.gender = document.getElementById('editGender').value.trim();
  p.sport = document.getElementById('editSport').value.trim();
  p.fit = document.getElementById('editFit').value.trim();
  p.size = document.getElementById('editSize').value.trim();
  p.launch = document.getElementById('editLaunch').value.trim();
  p.price = parseInt(document.getElementById('editPrice').value) || 0;
  p.composition = document.getElementById('editComposition').value.trim();
  p.filling = document.getElementById('editFilling').value.trim();
  var kwStr = document.getElementById('editKeywords').value.trim();
  p.keywords = kwStr ? kwStr.split(',').map(function(s){return s.trim();}).filter(Boolean) : [];
  p.overview = document.getElementById('editOverview').value.trim() || null;

  const rows = document.querySelectorAll('#editDescItemsContainer .desc-edit-row');
  p.descItems = [];
  rows.forEach(row => {
    const t = row.querySelector('.desc-title').value.trim();
    const c = row.querySelector('.desc-content').value.trim();
    if (t || c) p.descItems.push({title: t, content: c});
  });
  if (!p.descItems.length) p.descItems = null;
  // Also update PRODUCTS array
  const prod = PRODUCTS.find(x => x.id === p.id);
  if (prod) {
    prod.overview = p.overview; prod.descItems = p.descItems;
    prod.gender = p.gender; prod.sport = p.sport; prod.fit = p.fit;
    prod.size = p.size; prod.launch = p.launch; prod.price = p.price;
    prod.composition = p.composition; prod.filling = p.filling;
    prod.keywords = p.keywords;
  }
  // Save to localStorage for persistence
  const edits = JSON.parse(localStorage.getItem('wb_desc_edits') || '{}');
  edits[p.code] = {
    overview: p.overview, descItems: p.descItems,
    gender: p.gender, sport: p.sport, fit: p.fit,
    size: p.size, launch: p.launch, price: p.price,
    composition: p.composition, filling: p.filling,
    keywords: p.keywords
  };
  localStorage.setItem('wb_desc_edits', JSON.stringify(edits));
  // Re-render
  openProduct(p.id);
  toast('제품 정보가 저장되었습니다');
}

  function r5fill(c) {
    if (c <= 5)  return null;        // A-F: 배경 없음
    if (c <= 11) return fYellow;     // G-L
    if (c <= 20) return fGreen;      // M-U
    if (c === 21) return null;       // V: 배경 없음
    if (c === 22) return fYellow;    // W: Type
    if (c <= 42) return fCyan;       // X-AQ: Tags
    if (c <= 60) return fYellowB;    // AR-BI: Benefit+팬츠
    if (c <= 73) return fBlue;       // BJ-BV: DETAIL
    if (c <= 76) return fLGreen;     // BW-BY: PDP+필터
    return null;
  }

  // Row 1-4 (index 0-3): 맑은 고딕 9pt, 테두리 없음, 배경 없음
  for (var r = 0; r < 4; r++) {
    for (var c = 0; c < COLS; c++) {
      var a = XLSX.utils.encode_cell({r:r,c:c});
      if (!ws[a]) ws[a] = {v:'',t:'s'};
      ws[a].s = {font:fontMG9, alignment:wrapC};
    }
  }

  // Row 5 (index 4): Helvetica Neue 10pt, 테두리 thin, 영역별 색상
  for (var c5 = 0; c5 < COLS; c5++) {
    var a5 = XLSX.utils.encode_cell({r:4,c:c5});
    if (!ws[a5]) ws[a5] = {v:'',t:'s'};
    var s5 = {font:fontHN10, alignment:wrapC, border:allBdr};
    var f5 = r5fill(c5);
    if (f5) s5.fill = f5;
    ws[a5].s = s5;
  }

  // Row 6 (index 5): Row5와 동일 색상, 폰트 Apple SD Gothic Neo 10pt
  for (var c6 = 0; c6 < COLS; c6++) {
    var a6 = XLSX.utils.encode_cell({r:5,c:c6});
    if (!ws[a6]) ws[a6] = {v:'',t:'s'};
    var s6 = {font:fontSD10, alignment:wrapC, border:allBdr};
    var f6 = r5fill(c6);
    if (f6) s6.fill = f6;
    ws[a6].s = s6;
  }

  // 데이터행 (Row 7+): Malgun Gothic 10pt, 테두리 없음, 배경 없음
  for (var rd = 6; rd < rows.length; rd++) {
    for (var cd = 0; cd < COLS; cd++) {
      var ad = XLSX.utils.encode_cell({r:rd,c:cd});
      if (!ws[ad]) ws[ad] = {v:'',t:'s'};
      ws[ad].s = {font:fontMG10, alignment:wrapL};
    }
  }

  // ── 열 너비 (원본 정확 매칭) ──
  var cw = [11.25,11.25,16.625,13,13,12,13.625,16.625,13,32.375,16.625,42.875,13,13,13,13,13,13,13,13,13,42.875,13.875,4.125,13,13,13,13,13,4.375,4.125,13,13,13,13,13,13,13,13,13,13,4.125,13,10,13,10,13,13,13,13,13,13,13,13,13,13,13,13,13,13,68,10,13,12.875,10,16.75,13.125,16.875,10,16.5,16.125,31.5,27.375,33.375,16,15.375,10];
  ws['!cols'] = cw.map(function(w) { return {wch:w}; });

  // ── 행 높이 (원본 정확 매칭) ──
  ws['!rows'] = [{hpt:30},{hpt:30},{hpt:30},{hpt:30},{hpt:22.15},{hpt:52.5}];
  for (var rh = 6; rh < rows.length; rh++) {
    ws['!rows'][rh] = {hpt:40.15};
  }

  var wbk = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wbk, ws, '의류,용품(DB)');
  XLSX.writeFile(wbk, '26FW_ecommerce_output.xlsx');
  toast('이커머스 엑셀이 다운로드되었습니다');
}

// Load saved desc edits on product display
function applyDescEdits(p) {
  var ver = localStorage.getItem('wb_desc_ver');
  if (ver !== 'v3') { localStorage.removeItem('wb_desc_edits'); localStorage.setItem('wb_desc_ver','v3'); }
  var edits = JSON.parse(localStorage.getItem('wb_desc_edits') || '{}');
  var e = edits[p.code];
  if (e) {
    p.overview = e.overview; p.descItems = e.descItems;
    if (e.gender !== undefined) p.gender = e.gender;
    if (e.sport !== undefined) p.sport = e.sport;
    if (e.fit !== undefined) p.fit = e.fit;
    if (e.size !== undefined) p.size = e.size;
    if (e.launch !== undefined) p.launch = e.launch;
    if (e.price !== undefined) p.price = e.price;
    if (e.keywords !== undefined) p.keywords = e.keywords;
  }
}
